<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Orden de los Cronistas y el Enigma de Marola</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #12161b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: "Courier New", monospace;
        color: #8a94a6;
        overflow: hidden;
      }
      #pantalla {
        image-rendering: pixelated;
        border-radius: 2px;
        box-shadow: 0 0 0 6px #232a33, 0 14px 44px rgba(0, 0, 0, 0.7);
      }
      .ayuda { margin: 0; font-size: 12px; letter-spacing: 0.02em; }
      .errores {
        position: fixed; inset: 24px; overflow: auto; margin: 0; padding: 18px;
        background: #1b2430; color: #f0a0a0; border: 2px solid #e04c3c;
        white-space: pre-wrap; font-size: 13px; line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <canvas id="pantalla"></canvas>
    <p class="ayuda">Flechas o WASD para moverte · Enter o Espacio para hablar y avanzar</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
